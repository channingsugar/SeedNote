<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <style>
    text { font-family: 'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif; }
    .axis { font-size: 24px; font-weight: 700; fill: #171717; }
    .axis-end { font-size: 16px; font-weight: 600; fill: #666; }
    .panel { font-size: 22px; font-weight: 700; fill: #171717; }
    .quadrant { font-size: 17px; font-weight: 650; fill: #2f2f2f; }
    .strategy { font-size: 32px; font-weight: 700; fill: #111827; }
    .body { font-size: 18px; fill: #30343b; }
    .dimension { font-size: 15px; fill: #6b7280; }
    .judgement { font-size: 16px; fill: #5f6670; }
    .judgement-accent { font-size: 17px; font-weight: 700; fill: #1d4ed8; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#5d6775"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#d8e0e9" stroke-width="2"/>
    </pattern>
    <linearGradient id="old-blue-linear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FC"/>
      <stop offset="0.46" stop-color="#EDF4FD"/>
      <stop offset="1" stop-color="#E2EEFC"/>
    </linearGradient>
    <radialGradient id="old-blue-radial" cx="100%" cy="0%" r="120%" fx="100%" fy="0%">
      <stop offset="0" stop-color="#D6DEFC" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#D6DEFC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="820" fill="#fff"/>

  <!-- 纵轴：规模化程度 -->
  <line x1="80" y1="760" x2="80" y2="40" stroke="#5d6775" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="30" y="400" class="axis" text-anchor="middle" transform="rotate(-90 30 400)">规模化程度</text>
  <text x="120" y="225" class="axis-end" text-anchor="end">高</text>
  <text x="120" y="585" class="axis-end" text-anchor="end">低</text>

  <!-- 四象限底色与边界 -->
  <rect x="140" y="40" width="720" height="360" fill="#fbfbfb" stroke="#242424" stroke-width="1.3"/>
  <rect x="860" y="40" width="720" height="360" fill="url(#old-blue-linear)"/>
  <rect x="860" y="40" width="720" height="360" fill="url(#old-blue-radial)"/>
  <rect x="860" y="40" width="720" height="360" fill="none" stroke="#2563eb" stroke-width="4"/>
  <rect x="140" y="400" width="720" height="360" fill="url(#hatch)" stroke="#242424" stroke-width="1.3"/>
  <rect x="860" y="400" width="720" height="360" fill="#d7dde5" stroke="#242424" stroke-width="1.3"/>

  <!-- A -->
  <text x="185" y="92" class="panel">(a)</text>
  <text x="242" y="92" class="quadrant">市场渗透 · 风险等级 I</text>
  <text x="185" y="165" class="strategy">垂直品类服务</text>
  <text x="185" y="215" class="body">代办、专车与单点深耕</text>
  <text x="185" y="265" class="dimension">规模化高 / 服务空白低</text>
  <text x="185" y="325" class="judgement">既有供给相对充分，增长来自渗透率提升</text>

  <!-- B -->
  <text x="905" y="92" class="panel">(b)</text>
  <text x="962" y="92" class="quadrant">产品开发 · 风险等级 II</text>
  <text x="905" y="165" class="strategy">一站式服务（代理）</text>
  <text x="905" y="215" class="body">整合资质、运输、住宿与目的地链路</text>
  <text x="905" y="265" class="dimension">规模化高 / 服务空白高</text>
  <text x="905" y="325" class="judgement-accent">最契合当前市场需求，且服务空白、潜力高。</text>

  <!-- C -->
  <text x="185" y="452" class="panel">(c)</text>
  <text x="242" y="452" class="quadrant">市场开发 · 风险等级 II</text>
  <text x="185" y="525" class="strategy">拓展机会市场</text>
  <text x="185" y="575" class="body">将既有垂直能力复制到新客群 / 新场景</text>
  <text x="185" y="625" class="dimension">规模化低 / 服务空白低</text>
  <text x="185" y="685" class="judgement">需求较分散，增长依赖区域与客群拓展</text>

  <!-- D -->
  <text x="905" y="452" class="panel">(d)</text>
  <text x="962" y="452" class="quadrant">多元化 · 风险等级 IV</text>
  <text x="905" y="525" class="strategy">自助型服务（DIY）</text>
  <text x="905" y="575" class="body">面向新市场建立全新的自助服务形态</text>
  <text x="905" y="625" class="dimension">规模化低 / 服务空白高</text>
  <text x="905" y="685" class="judgement">用户更小众，市场与服务能力需同步教育</text>

  <!-- 横轴移至四象限下方 -->
  <text x="500" y="805" class="axis-end" text-anchor="middle">低</text>
  <text x="1220" y="805" class="axis-end" text-anchor="middle">高</text>
  <line x1="140" y1="825" x2="1580" y2="825" stroke="#5d6775" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="875" class="axis" text-anchor="middle">服务空白度</text>
</svg>
